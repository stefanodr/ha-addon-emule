configuration:
  download_path:
    name: Download folder
    description: Base folder for downloads (under /media or /share). The Incoming and Temp sub-folders are created here on first start (default /media/amule).
  require_external_disk:
    name: Require a separate disk
    description: Turn this on when the download folder is on an external disk, for example /media/Volume/amule. If the disk is not connected, the add-on waits for it and then stops, instead of writing to the system disk.
  nickname:
    name: Nickname
    description: Name other ed2k users see for you.
  web_password:
    name: Web interface password
    description: Password of the aMule web interface. If empty, a random one is generated once and shown in the add-on log.
network:
  4662/tcp: aMule TCP port (ed2k client connections)
  4672/udp: aMule UDP port (Kad and extended requests)

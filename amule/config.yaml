name: aMule
version: "0.1.0"
slug: amule
description: aMule (ed2k / Kad) native Linux daemon with web interface, a lightweight alternative to the eMule add-on
url: https://github.com/stefanodr/ha-addon-emule
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
stage: experimental
ingress: true
ingress_port: 4721
panel_icon: mdi:donkey
panel_title: aMule
map:
  - type: media
    read_only: false
  - type: share
    read_only: false
ports:
  4662/tcp: 4662
  4672/udp: 4672
ports_description:
  4662/tcp: aMule TCP port (ed2k client connections)
  4672/udp: aMule UDP port (Kad and extended requests)
options:
  download_path: /media/amule
  require_external_disk: false
  nickname: HAmule
  web_password: ""
schema:
  download_path: str
  require_external_disk: bool
  nickname: str
  web_password: password?
